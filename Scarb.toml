[package]
name = "sessions_smart_contract"
version = "1.0.0"
edition = "2024_07"

[dependencies]
starknet = ">=2.8.0"
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v2.0.0" }
avnu_lib = { git = "https://github.com/avnu-labs/avnu-contracts-lib", tag = "v0.1.0" }
snforge_std_deprecated = { git = "https://github.com/foundry-rs/starknet-foundry.git", tag = "v0.50.0" }

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"
build = "scarb build"

